name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  schichten:
    name: Schichten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ADR 0012: `crosspoint-modell` ist die gemeinsame Schicht für alle
      # Kerne. Es darf an nichts Plattformabhängiges hängen - kein PipeWire,
      # kein JACK, kein HTTP-Server, keine Ereignisschleife.
      - name: Modell bleibt plattformfrei
        run: |
          cargo tree -p crosspoint-modell --edges normal --prefix none | sort -u
          if cargo tree -p crosspoint-modell --edges normal --prefix none \
             | grep -qiE 'pipewire|libspa|jack|sonora|tiny_http|rtrb|ksni'; then
            echo "::error::crosspoint-modell hängt an einer Plattform-Bibliothek (ADR 0012)"
            exit 1
          fi
      # ADR 0012, Stufe 2/3: das Fenster redet nur über die Naht mit dem Kern.
      # Es darf deshalb keine Kern-Bibliothek im Baum haben - sonst wäre ein
      # zweiter Kern (Windows/macOS) wieder Arbeit an der Oberfläche.
      - name: Fenster kennt keinen Plattform-Kern
        run: |
          cargo tree -p crosspoint-fenster --edges normal --prefix none | sort -u
          if cargo tree -p crosspoint-fenster --edges normal --prefix none \
             | grep -qiE 'pipewire|libspa|jack-sys|sonora|rtrb|tiny_http'; then
            echo "::error::crosspoint-fenster hängt an einer Kern-Bibliothek (ADR 0012)"
            exit 1
          fi

  test:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Die Engine linkt gegen libjack.so.0 (Soname) und spricht PipeWire ueber
      # die offiziellen Bindings (pipewire-sys -> bindgen). Ohne die Pakete
      # baut die Lib, aber das Test-Binary scheitert beim Laden, bzw. bindgen
      # findet libclang nicht.
      - name: Systembibliotheken
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjack-jackd2-dev libpipewire-0.3-dev libclang-dev pkg-config
      # Gestartet wird im CI nichts: kein PipeWire, kein Audio.
      - name: Clippy (nur echte Fehler blockieren)
        run: cargo clippy --all-targets --locked --workspace -- -D clippy::correctness
      - name: Tests
        run: |
          # Ein Thread: die Pegel- und Allokationstests messen global und
          # duerfen sich nicht gegenseitig beeinflussen. --release wie lokal.
          RUST_BACKTRACE=1 cargo test --release --locked --workspace -- --test-threads=1
      - name: Release-Build
        run: cargo build --release --locked
      # Das Fenster (egui) laedt Wayland/X11 und OpenGL zur Laufzeit; zum
      # Bauen genuegen die Pakete oben.
      - name: Oberflaeche bauen (Feature ui)
        run: cargo build --release --locked --features ui --bin crosspoint
      # Der Flatpak-Job baut im Container ohne Rust; er bekommt das Binary hier.
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: target/release/crosspoint-engine
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: target/release/crosspoint

  metadata:
    name: Paket-Metadaten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net packaging/linux/*.metainfo.xml
      # Die Version der metainfo schreibt release-please (extra-files) aus der
      # Cargo.toml; sie darf hier nicht auseinanderlaufen. Das Datum meldet das
      # Skript nur - es kommt aus dem Changelog und wird beim Paketbau gesetzt.
      - name: Version der metainfo passt zur Cargo.toml
        run: python3 packaging/linux/metainfo.py --pruefen

  flatpak:
    name: Flatpak bauen
    needs: test
    runs-on: ubuntu-latest
    # Container mit fertigem flatpak-builder und GNOME-Runtime; ohne ihn
    # scheitert der Schritt bereits beim Setup (Image/Action-Paar).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: prebuilt
      # Das Manifest braucht beide Programme in `prebuilt/` (das Flatpak baut
      # kein cargo): `crosspoint` mit Fenster und `crosspoint-engine`.
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: prebuilt
      - run: |
          chmod +x prebuilt/crosspoint prebuilt/crosspoint-engine
          ls -l prebuilt
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: crosspoint-ci.flatpak
          manifest-path: flatpak/de.weppelmann.Crosspoint.yml
