# Crosspoint als Flatpak.
#
# Das Fenster ist egui (crates/fenster): es braucht nur, was jede Runtime hat
# (Wayland/X11, EGL/GL), keine GNOME-Bibliotheken. Darum die Freedesktop-
# Runtime; sie bringt auch pactl, pw-link, pw-dump, pw-cli und libjack
# (pipewire-jack) mit, die Engine und crosspoint-wire.sh benutzen.
#
# Gebaut wird hier nichts: `crosspoint` und `crosspoint-engine` kommen fertig
# aus dem CI (cargo build --release --features ui) und liegen in prebuilt/
# (nicht eingecheckt). Lokal:
#   cargo build --release --features ui
#   mkdir -p prebuilt && cp target/release/crosspoint target/release/crosspoint-engine prebuilt/
#   flatpak-builder --user --force-clean build-dir flatpak/de.weppelmann.Crosspoint.yml
app-id: de.weppelmann.Crosspoint
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: crosspoint

finish-args:
  # Audio: PulseAudio-Socket des Hosts (PipeWire-Pulse) für pactl-Null-Sinks
  - --socket=pulseaudio
  # Nativer PipeWire-Zugriff (pw-link, pw-dump, JACK-Client)
  - --filesystem=xdg-run/pipewire-0
  - --share=ipc
  # Steuer-API (127.0.0.1:8770), OSC und VBAN
  - --share=network
  # Fenster: Wayland bevorzugt, X11 als Rückfall; dri für OpenGL
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Tray-Icon: StatusNotifierItem auf dem Sitzungsbus
  - --socket=session-bus
  # Konfiguration (~/.config/crosspoint) darf angelegt werden
  - --filesystem=~/.config/crosspoint:create
  # Autostart-Eintrag schreiben und wieder entfernen
  - --filesystem=xdg-config/autostart:create

modules:
  # Eingefrorene Cargo-Quellen: flatpak-builder lädt jedes Paket aus
  # Cargo.lock und prüft seine Prüfsumme; fehlt eines, bricht der Bau ab.
  # Erzeugt mit packaging/flatpak/quellen.py (Format wie
  # flatpak-cargo-generator). Installiert wird nichts.
  - name: cargo-quellen
    buildsystem: simple
    build-commands:
      - |
        set -eu
        anzahl=$(grep -c '"type": "archive"' new-sources.json)
        gefunden=$(ls -d cargo/vendor/*/ | wc -l)
        echo "Cargo-Quellen: $gefunden von $anzahl eingefrorenen Paketen entpackt"
        test "$anzahl" -gt 0
        test "$gefunden" -eq "$anzahl"
    sources:
      - new-sources.json
      - type: file
        path: new-sources.json

  - name: crosspoint
    buildsystem: simple
    build-commands:
      - install -Dm755 crosspoint /app/bin/crosspoint
      - install -Dm755 crosspoint-engine /app/bin/crosspoint-engine
      # Die Engine sucht crosspoint-wire.sh neben ihrem Programm.
      - install -Dm755 scripts/crosspoint-wire.sh /app/bin/crosspoint-wire.sh
      - |
        mkdir -p /app/share/applications
        sed 's|^Exec=.*|Exec=crosspoint|' packaging/linux/de.weppelmann.Crosspoint.desktop \
          > /app/share/applications/de.weppelmann.Crosspoint.desktop
        chmod 644 /app/share/applications/de.weppelmann.Crosspoint.desktop
      - install -Dm644 packaging/linux/de.weppelmann.Crosspoint.metainfo.xml
          /app/share/metainfo/de.weppelmann.Crosspoint.metainfo.xml
      - |
        for n in 16 32 48 64 128 256 512; do
          install -Dm644 "data/icons/hicolor/${n}x${n}/apps/de.weppelmann.Crosspoint.png" \
            "/app/share/icons/hicolor/${n}x${n}/apps/de.weppelmann.Crosspoint.png"
        done
      - install -Dm644 crates/fenster/schriften/OFL.txt /app/share/doc/crosspoint/IBM-Plex-OFL.txt
      # Die Icons (Lucide) stecken im Fenster — ISC, Beilage mitliefern.
      - install -Dm644 crates/fenster/icons/LUCIDE-LICENSE.txt /app/share/doc/crosspoint/LUCIDE-LICENSE.txt
    sources:
      - type: file
        path: ../prebuilt/crosspoint
      - type: file
        path: ../prebuilt/crosspoint-engine
      - type: dir
        path: ..
        skip:
          - prebuilt
          - .git
          - target
          - build-dir
          - flatpak
          - dist
