    <rect x="396" y="228" width="56" height="56" rx="16"/>
    <rect x="228" y="60" width="56" height="56" rx="16"/>
    <rect x="228" y="396" width="56" height="56" rx="16"/>
  </g>
  <rect x="230" y="230" width="52" height="52" rx="15" fill="#000000"/>
